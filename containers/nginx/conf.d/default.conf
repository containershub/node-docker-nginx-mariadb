server {
    listen 80;
    server_name localhost nodeapp.test;
    # Nginx defaults to 1MB "client_max_body_size 1M" upload limit. Which often
    # trips up developers testing file uploads or large JSON payloads locally.
    # Increase the upload size to avoid local testing hitting "413 Request
    # Entity Too Large" error.
    client_max_body_size 50M;

    location / {
        # Forward all incoming HTTP requests to the NodeJS container
        #
        # Nginx forwards all traffic arriving at localhost or nodeapp.test
        # directly to the node service over Docker's internal app-network on
        # port 3000. (If your Node app runs on a different port, update 3000
        # here and in docker-compose.yml to match.)
        #
        # Using Docker's internal DNS resolver "127.0.0.11" to avoid Nginx
        # crashing if node container restarts, as nginx depends on Node!
        resolver 127.0.0.11 valid=30s;
        set $upstream_node http://node:3000;
        proxy_pass $upstream_node;

        # Use HTTP/1.1 for persistent connections and WebSocket support
        proxy_http_version 1.1;

        # Enable WebSockets (essential for Vite HMR, Socket.io, etc)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Pass original client request details to your NodeJS app
        #
        # Host, X-Real-IP, and X-Forwarded-For ensure your Node.js framework
        # (Express, Fastify, NestJS, etc.) sees the real client IP and domain
        # rather than Nginx's internal container IP.
        proxy_set_header HOST $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}
